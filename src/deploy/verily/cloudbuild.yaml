steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - --target=pipeline
      - -f
      - deploy/verily/Dockerfile
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args: [run, --rm, '${_IMAGE}', pathnd-qc, --help]
  - name: gcr.io/cloud-builders/docker
    args: [run, --rm, --network=none, '${_IMAGE}', pathnd-qc, setup, grandqc, --check]
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: REPLACE_WITH_ARTIFACT_REGISTRY_IMAGE
timeout: 3600s
