# Run coverage commands from the repository root; include worker subprocesses.
[run]
branch = true
parallel = true
patch = subprocess
sigterm = true
source =
    pathnd_qc
    src/deploy/verily
omit =
    */tests/*
    */test_*.py

[paths]
package =
    src/pathnd_qc
    */pathnd_qc
deployment =
    src/deploy/verily
    */deploy/verily

[report]
precision = 2
skip_empty = true
